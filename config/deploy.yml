# Kamal deploy config. docs/deploy.md has the steps in order.
<% host = "onset.joaotorr.es" %>
<% registry_user = "joaotorres" %>

service: onset

# GitHub Container Registry. Packages are private by default and the package
# inherits this repository's visibility on first push.
image: <%= registry_user %>/onset

# The Hostinger VPS shared with done (done.joaotorr.es) and linkpass. kamal-proxy
# is already on the host, so this app only registers its own host with it.
servers:
  web:
    - <%= host %>

# kamal-proxy terminates SSL with a Let's Encrypt certificate. Rails runs with
# assume_ssl and force_ssl to match (config/environments/production.rb).
proxy:
  ssl: true
  host: <%= host %>

registry:
  server: ghcr.io
  # KAMAL_REGISTRY_PASSWORD is a GitHub personal access token with
  # write:packages, not a password (docs/deploy.md).
  username: <%= registry_user %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Secrets come from .kamal/secrets, which reads them from the macOS Keychain.
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Solid Queue runs inside Puma, so this one container is the whole app:
    # HTML, WebSockets and jobs (SPEC.md, Architecture).
    SOLID_QUEUE_IN_PUMA: true

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The four SQLite databases (primary, cache, queue, cable) and local Active
# Storage files live in storage/ (config/database.yml), on this named volume.
# No database accessory: SQLite is the whole persistence layer.
volumes:
  - "onset_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: amd64
