# skills-loop config. Read as KEY=value text by the plugin's scripts and
# skills, never executed as shell. Quotes are optional. Comments go on their
# own line or after " #" on an unquoted value.

# Format of this file. The plugin refuses a version it does not read.
CONF_VERSION=1

# Tickets live in .scratch/<SLUG>/issues/, reviews in .scratch/<SLUG>/reviews/.
# Commit trailer: Ticket: <SLUG>/NN. Changing it starts a fresh board.
SLUG=onset-v1

# The one spec file. Triage commits spec changes here before a ticket is ready.
SPEC=SPEC.md

# Run by bin/deploy from the repo root, on BRANCH, after you confirm.
DEPLOY=bin/kamal deploy

# Deploy tags are <TAG_PREFIX>-YYYYMMDD-HHMM. The review range starts at the newest.
TAG_PREFIX=deploy

# Trunk. Tickets commit here, auto and deploy refuse to run elsewhere.
BRANCH=main

# Design system file whose changelog gates Kind: visual tickets.
# Empty: no visual gate, Kind is still recorded.
DESIGN=

# Doc whose "## Design links" section names the design canvas, the version
# last handed off and each board. /design-brief and /design-entry keep it
# current. Empty: none yet; /design-brief creates one with a new canvas.
DESIGN_HANDOFF=
